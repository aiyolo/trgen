[package]
name = "struct-sheet-gpui"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "StructSheet"
path = "src/main.rs"

[dependencies]
calamine = "0.36.1"
gpui-kit = { version = "=0.9.0", features = ["tree-sitter-c"] }
# Same engine gpui-kit 0.9.0 pins; direct dep keeps `use gpui::…` paths working.
gpui = { package = "gpui-pre", version = "=0.3.11" }
raw-window-handle = "0.6"
rfd = "0.15"
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
embed-resource = "3"
