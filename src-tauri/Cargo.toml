[package]
name = "struct-sheet"
version = "0.5.1"
description = "Convert nested C structs into formatted Excel workbooks"
authors = ["StructSheet"]
edition = "2021"

[lib]
name = "struct_sheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
rust_xlsxwriter = "0.90"
calamine = "0.36.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[patch.crates-io]
ctor = { path = "vendor/ctor" }
